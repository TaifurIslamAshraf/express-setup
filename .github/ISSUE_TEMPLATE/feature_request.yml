name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Help us improve the project by suggesting new features or enhancements."
  - type: input
    id: feature_name
    attributes:
      label: "Feature Name"
      description: "Give a short name to the feature request."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Provide a detailed description of the feature or enhancement."
      placeholder: "What is the feature about? How would it help users?"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: "Use Case"
      description: "Explain the use case or problem this feature will solve."
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives"
      description: "Describe any alternative solutions you've considered."
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Add any other details, screenshots, or mockups."

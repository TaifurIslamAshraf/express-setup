name: Bug Report
description: Report a bug or issue with the project
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please provide detailed information about the bug you encountered."
  - type: input
    id: title
    attributes:
      label: "Short description"
      description: "Provide a concise title for the bug."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Provide steps to reproduce the behavior."
      placeholder: "- Step 1...\n- Step 2...\n- Step 3..."
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
  - type: textarea
    id: actual_behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "List your environment details (e.g., OS, browser, Node.js version)."
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How severe is the issue?"
      options:
        - Critical
        - High
        - Medium
        - Low
